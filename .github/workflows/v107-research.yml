name: MAHORAGA v10.7 paper analytics tests
on:
  push:
    branches: [research/v10.7-paper-dashboard-20261118]
    paths: ['research/v10/research/**', '.github/workflows/v107-research.yml']
permissions: {contents: read}
jobs:
  paper-dashboard-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node research/v10/research/ledger.test.cjs
      - run: node research/v10/research/causal.test.cjs
      - run: node research/v10/research/challenger.test.cjs
      - run: node research/v10/research/metrics.test.cjs
      - run: node --check research/v10/research/dashboard/app.js
