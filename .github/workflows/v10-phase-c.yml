name: MAHORAGA Phase C Paper Advisory Supervisor
on:
  push:
    branches: [research/v10-mahoraga-preactivation]
    paths: ['research/v10/supervisor/**','.github/workflows/v10-phase-c.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node research/v10/supervisor/supervisor.test.cjs
