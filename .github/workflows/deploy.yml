name: Deploy INVO Ultimate to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['INVO Automated Paper Research']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check published HTML
        run: |
          test -s index.html
          grep -q 'INVO Ultimate v6.1' index.html
          test -s v61-core.js
          test -s v61.js
          test -s v62.js
          test -s v63.js
          test -s v64.js
          test -s v65.js
          test -s v66.js
          test -s research/regimes.cjs
          test -s research/integrity.cjs
          test -s research/diagnose.cjs
          test -s research/forward.cjs
          test -s research/run.cjs
      - name: Validate JavaScript and backtest accounting
        run: |
          node --check v61-core.js
          node --check v61.js
          node --check v62.js
          node --check v63.js
          node --check v64.js
          node --check v65.js
          node --check v66.js
          node --check research/regimes.cjs
          node --check research/integrity.cjs
          node --check research/diagnose.cjs
          node --check research/forward.cjs
          node v61-core.test.cjs
          node research/run.test.cjs
          node research/forward.test.cjs
          node research/diagnose.test.cjs
          node research/integrity.test.cjs
          node research/regimes.test.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
