name: Deploy INVO Ultimate to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      restore_sha:
        description: 'Optional full 40-character previous main-branch commit SHA to restore (manual only)'
        required: false
        type: string
  workflow_run:
    workflows: ['INVO Automated Paper Research']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.restore_sha || 'main' }}
      - name: Validate requested manual restore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.restore_sha != '' }}
        env:
          RESTORE_SHA: ${{ inputs.restore_sha }}
        run: |
          [[ "$RESTORE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Restore requires full commit SHA'; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo 'Restore SHA must belong to main branch history'; exit 1; }
          echo 'Restoring previously committed main-branch version; tests still required.'
      - name: Check published HTML
        run: |
          test -s index.html
          grep -q 'INVO Ultimate v6.1' index.html
          test -s v61-core.js
          test -s v61.js
          test -s v62.js
          test -s v63.js
          test -s v64.js
          test -s v65.js
          if [ "${{ inputs.restore_sha }}" = '' ]; then test -s v66.js; fi
          if [ "${{ inputs.restore_sha }}" = '' ]; then test -s v67.js; fi
          if [ "${{ inputs.restore_sha }}" = '' ]; then test -s v68.js; fi
          if [ "${{ inputs.restore_sha }}" = '' ]; then test -s research/forward-intelligence.cjs; fi
          if [ "${{ inputs.restore_sha }}" = '' ]; then test -s research/operations.cjs; fi
          if [ "${{ inputs.restore_sha }}" = '' ]; then test -s research/release-gate.cjs; fi
          test -s research/regimes.cjs
          test -s research/integrity.cjs
          test -s research/diagnose.cjs
          test -s research/forward.cjs
          test -s research/run.cjs
      - name: Validate JavaScript and backtest accounting
        run: |
          node --check v61-core.js
          node --check v61.js
          node --check v62.js
          node --check v63.js
          node --check v64.js
          node --check v65.js
          if [ -f v66.js ]; then node --check v66.js; fi
          if [ -f v67.js ]; then node --check v67.js; fi
          if [ -f v68.js ]; then node --check v68.js; fi
          if [ -f research/forward-intelligence.cjs ]; then node --check research/forward-intelligence.cjs; fi
          if [ -f research/forward-intelligence.test.cjs ]; then node research/forward-intelligence.test.cjs; fi
          if [ -f research/operations.cjs ]; then node --check research/operations.cjs; fi
          if [ -f research/operations.test.cjs ]; then node research/operations.test.cjs; fi
          if [ -f research/release-gate.cjs ]; then node research/release-gate.cjs; else
            [ "$(git hash-object index.html)" = '605deb4c8b4c00a2cea90d54be2c30ec2d6c5d44' ]
            [ "$(git hash-object v61-core.js)" = '4c9762f67b6262dc8cd3854281b8aaf1e882dc47' ]
            [ "$(git hash-object research/forward.cjs)" = 'aa493d50abe4fc091810011933bc128df9030b4f' ]
          fi
          node --check research/regimes.cjs
          node --check research/integrity.cjs
          node --check research/diagnose.cjs
          node --check research/forward.cjs
          node v61-core.test.cjs
          node research/run.test.cjs
          node research/forward.test.cjs
          node research/diagnose.test.cjs
          node research/integrity.test.cjs
          if [ -f research/regimes.test.cjs ]; then node research/regimes.test.cjs; fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
