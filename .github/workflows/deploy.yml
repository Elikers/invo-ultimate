name: Deploy INVO Ultimate to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check published HTML
        run: |
          test -s index.html
          grep -q 'INVO Ultimate v6.1' index.html
          test -s v61-core.js
          test -s v61.js
          test -s v62.js
          test -s research/run.cjs
      - name: Validate JavaScript and backtest accounting
        run: |
          node --check v61-core.js
          node --check v61.js
          node --check v62.js
          node v61-core.test.cjs
          node research/run.test.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
