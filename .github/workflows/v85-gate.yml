name: INVO v8.5 Multi-Timeframe Integrity
on:
  push:
    branches: [research/v8.2-v8.8-verified-gates]
    paths: ['research/v85/**','.github/workflows/v85-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/v85/timeframes.test.cjs
