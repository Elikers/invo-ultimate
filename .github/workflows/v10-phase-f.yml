name: MAHORAGA Phase F Research Feedback and Memory
on:
  push:
    branches: [research/v10-mahoraga-preactivation]
    paths: ['research/v10/feedback/**','.github/workflows/v10-phase-f.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node research/v10/feedback/feedback.test.cjs
