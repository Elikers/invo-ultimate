name: INVO v8.2 Forward Collector Evidence Gate
on:
  push:
    branches: [research/v8.2-v8.8-verified-gates]
    paths: ['research/v82/**','.github/workflows/v82-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/v82/collector-gate.test.cjs
