name: MAHORAGA Gate 2 Chronological Specialist Research
on:
  push:
    branches: [research/v10-mahoraga-five-gates]
    paths: ['research/v10/next/temporal*','.github/workflows/v10-gate2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node research/v10/next/temporal.test.cjs
