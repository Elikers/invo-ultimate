name: INVO v8.6 AI Candidate Evidence Gate
on:
  push:
    branches: [research/v8.2-v8.8-verified-gates]
    paths: ['research/v86/**','.github/workflows/v86-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/v86/paired.test.cjs
