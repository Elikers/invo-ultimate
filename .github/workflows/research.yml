name: INVO Automated Paper Research

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '20 1 * * *'
  push:
    branches: [main]
    paths:
      - 'research/run.cjs'
      - 'research/run.test.cjs'
      - 'research/diagnose.cjs'
      - 'research/diagnose.test.cjs'
      - 'research/integrity.cjs'
      - 'research/integrity.test.cjs'
      - 'research/regimes.cjs'
      - 'research/regimes.test.cjs'
      - 'research/operations.cjs'
      - 'research/operations.test.cjs'
      - 'research/schedule-audit.cjs'
      - 'research/schedule-audit.test.cjs'
      - 'research/archive-audit.cjs'
      - 'research/archive-audit.test.cjs'
      - 'research/backup-manifest.cjs'
      - 'research/backup-manifest.test.cjs'
      - 'research/release-gate.cjs'
      - 'research/forward.cjs'
      - 'research/forward.test.cjs'
      - 'research/collect.cjs'
      - 'research/collect.test.cjs'
      - '.github/workflows/research.yml'

permissions:
  contents: write

concurrency:
  group: invo-v63-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Synchronize latest research state before collection
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "Using latest main state: $(git rev-parse --short HEAD)"
      - name: Validate offline tests
        run: |
          node --check research/run.cjs
          node research/run.test.cjs
          node --check research/diagnose.cjs
          node research/diagnose.test.cjs
          node --check research/integrity.cjs
          node research/integrity.test.cjs
          node --check research/regimes.cjs
          node research/regimes.test.cjs
          node --check research/operations.cjs
          node research/operations.test.cjs
          node --check research/schedule-audit.cjs
          node research/schedule-audit.test.cjs
          node --check research/archive-audit.cjs
          node research/archive-audit.test.cjs
          node --check research/backup-manifest.cjs
          node research/backup-manifest.test.cjs
          node research/release-gate.cjs
          node --check research/forward.cjs
          node research/forward.test.cjs
          node --check research/collect.cjs
          node research/collect.test.cjs
          node v61-core.test.cjs
          python3 -m py_compile research/email_report.py
      - name: Fast forward collector (scheduled 15-minute polling)
        if: ${{ github.event_name != 'schedule' || github.event.schedule == '*/15 * * * *' }}
        run: node research/collect.cjs
      - name: Full historical and forward research (daily or manual)
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '20 1 * * *') }}
        run: node research/run.cjs
      - name: Archive paper observations and verify research health
        if: ${{ success() }}
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] || { [ "${{ github.event_name }}" = 'schedule' ] && [ "${{ github.event.schedule }}" = '20 1 * * *' ]; }; then
            node research/operations.cjs --full
          else
            node research/operations.cjs
          fi
          node research/archive-audit.cjs
      - name: Save versioned research output to repository
        run: |
          git config user.name "invo-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/latest.json research/forward-journal.json research/forward-summary.json
          git add research/operations-health.json
          if [ -f research/archive/forward-events.jsonl ]; then git add research/archive/forward-events.jsonl; fi
          if [ -d research/archive/daily ]; then git add research/archive/daily/*.json; fi
          if [ -f research/loss-diagnosis.json ]; then git add research/loss-diagnosis.json; fi
          if [ -f research/market-intelligence.json ]; then git add research/market-intelligence.json; fi
          if [ -f research/integrity-risk.json ]; then git add research/integrity-risk.json; fi
          if [ -f research/collector-health.json ]; then git add research/collector-health.json; fi
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "data: refresh automated INVO research and collector health"
            git status --short
            if ! git -c rebase.autoStash=true pull --rebase origin main; then
              git rebase --abort || true
              echo 'A newer research journal was published during this run; refusing unsafe overwrite. Next run will start from latest main.'
              exit 1
            fi
            git push origin HEAD:main
          fi
      - name: Send Gmail daily digest when configured
        if: ${{ success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '20 1 * * *')) }}
        env:
          INVO_GMAIL_ADDRESS: ${{ secrets.INVO_GMAIL_ADDRESS }}
          INVO_GMAIL_APP_PASSWORD: ${{ secrets.INVO_GMAIL_APP_PASSWORD }}
          INVO_REPORT_TO: ${{ secrets.INVO_REPORT_TO }}
        run: |
          if [ -z "$INVO_GMAIL_ADDRESS" ] || [ -z "$INVO_GMAIL_APP_PASSWORD" ] || [ -z "$INVO_REPORT_TO" ]; then
            echo "Gmail secrets not configured yet: skipping email delivery."
          else
            python3 research/email_report.py
          fi
      - name: Generate verified backup manifest
        if: always()
        run: |
          node research/backup-manifest.cjs
      - name: Upload immutable run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invo-research-${{ github.run_id }}
          path: |
            research/latest.json
            research/loss-diagnosis.json
            research/market-intelligence.json
            research/integrity-risk.json
            research/forward-summary.json
            research/forward-journal.json
            research/collector-health.json
            research/operations-health.json
            research/archive/forward-events.jsonl
            research/archive/daily/*.json
            research/backup-manifest.json
          if-no-files-found: ignore
          retention-days: 90
