name: MAHORAGA v10.6 gated challenger safety tests
on:
  push:
    branches: [research/v10.6-challenger-20261118]
    paths: ['research/v10/research/**', '.github/workflows/v106-research.yml']
permissions: {contents: read}
jobs:
  candidate-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node research/v10/research/ledger.test.cjs
      - run: node research/v10/research/causal.test.cjs
      - run: node research/v10/research/challenger.test.cjs
