name: MAHORAGA Pre-Activation Complete Offline Research Rehearsal
on:
  push:
    branches: [research/v10-mahoraga-preactivation]
    paths: ['research/v10/integration/**','.github/workflows/v10-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify all standalone phase modules
        run: |
          node research/v10/data/provenance.test.cjs
          node research/v10/data/feed-adapters.test.cjs
          node research/v10/learners/specialists.test.cjs
          node research/v10/supervisor/supervisor.test.cjs
          node research/v10/governance/governance.test.cjs
          node research/v10/evidence/evaluate.test.cjs
          node research/v10/feedback/feedback.test.cjs
      - name: End-to-end offline no-order, no-model-promotion rehearsal
        run: node research/v10/integration/offline-rehearsal.cjs
