name: MAHORAGA v10.4 Research Release Evidence Archive
on:
  push:
    branches: [research/v10.4-evidence-archive]
    paths:
      - '.github/workflows/v104-archive.yml'
      - 'research/v10/ops/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verified-source-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: \${{ github.token }}
      SOURCE_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and inherited source safety checks
        run: |
          node research/v10/ops/archive.test.cjs
          node research/v10/forward/audit.test.cjs
          node research/v10/forward/forward.test.cjs
      - name: Capture NEW bounded public feed receipt (no earlier artifact access required)
        env:
          MAHORAGA_FORWARD_OUT: /tmp/v104-evidence
        run: node research/v10/forward/capture.cjs
      - name: Derive and reverify complete provenance manifest
        run: |
          node - <<'JS'
          const a=require('./research/v10/ops/archive.cjs');
          const m=a.write('/tmp/v104-evidence',process.env.SOURCE_RUN_ID);
          if(m.observed!==0||m.gaps!==3||m.approved_for_live!==false)
            throw Error('Expected old pre-registration gaps only');
          console.log(JSON.stringify({source_run:m.source_run_id,observed:m.observed,gaps:m.gaps,
            offsite_backup:false,independent_anchor:false,approved_for_live:false}));
          JS
      - name: Release unique, checksum-verified research-only archive (not immutable offsite backup)
        run: |
          set -euo pipefail
          cd /tmp/v104-evidence
          sha256sum capture-receipt.json selected-public-frames.json archive-manifest.json > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          tag="mahoraga-v104-research-run-$SOURCE_RUN_ID"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Archive already exists: refusing overwrite'
            exit 3
          fi
          gh release create "$tag" --target "$GITHUB_SHA" -R "$GITHUB_REPOSITORY" --prerelease \
            --title "MAHORAGA research receipt $SOURCE_RUN_ID (not external attestation)" \
            --notes "Research-only source receipt with 0 pre-registration observations. GitHub release is durable relative to ephemeral artifacts, but NOT write-once or independent/offsite." \
            capture-receipt.json selected-public-frames.json archive-manifest.json SHA256SUMS.txt
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mahoraga-v104-research-archive-audit
          path: /tmp/v104-evidence/
          retention-days: 30
