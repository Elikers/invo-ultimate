name: INVO v8.1 Economics and Risk Diagnostics
on:
  push:
    branches: [research/v7.5-multi-exchange]
    paths:
      - 'research/v81/**'
      - '.github/workflows/v81-economics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check research/v81/costs.cjs
      - run: node research/v81/costs.test.cjs
