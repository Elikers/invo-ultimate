name: MAHORAGA Three-Market Read-Only Bounded Pilot
on:
  push:
    branches: [research/v10-twelve-gates]
    paths: ['research/v10/twelve/run-multi-public.cjs','.github/workflows/v10-three-public.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bounded 12-second public data pilot
        run: node research/v10/twelve/run-multi-public.cjs --research-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mahoraga-three-market-public-pilot-unvalidated
          path: mahoraga-multimarket-public-pilot/
          retention-days: 7
