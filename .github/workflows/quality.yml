name: INVO Pull Request Quality Gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen trading engine and JavaScript syntax
        run: |
          node research/release-gate.cjs
          for f in v61-core.js v61.js v62.js v63.js v64.js v65.js v66.js v67.js research/*.cjs; do node --check "$f"; done
      - name: Verify historical, forward and operations logic
        run: |
          node v61-core.test.cjs
          for f in research/*.test.cjs; do node "$f"; done
          python3 -m py_compile research/email_report.py
