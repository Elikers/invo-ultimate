name: MAHORAGA Phase A Strict Feed Adapters
on:
  push:
    branches: [research/v10-mahoraga-preactivation]
    paths: ['research/v10/data/feed-adapters*','.github/workflows/v10-phase-a.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node research/v10/data/provenance.test.cjs && node research/v10/data/feed-adapters.test.cjs
