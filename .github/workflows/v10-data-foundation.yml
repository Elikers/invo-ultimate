name: MAHORAGA v10 Research Data Foundation Offline Gates
on:
  push:
    branches: [research/v10-data-foundation]
    paths:
      - 'research/v10/data/**'
      - '.github/workflows/v10-data-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify research-only integrity and anti-lookahead gates
        run: node research/v10/data/provenance.test.cjs
