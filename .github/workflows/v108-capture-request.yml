name: MAHORAGA v10.8 Research Capture Trigger (no trading)
on:
  push:
    branches: [research/v10.8-operations-safety]
    paths: ['research/v10/forward/capture-request.json']
permissions:
  contents: read
concurrency:
  group: mahoraga-v108-public-capture
  cancel-in-progress: false
jobs:
  future-only-public-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preregistration and public-data-only code
        run: |
          node research/v10/forward/forward.test.cjs
          node research/v10/forward/audit.test.cjs
          node research/v10/ops/monitor.test.cjs
          node - <<'JS'
          const x=require('./research/v10/forward/capture-request.json');
          if(x.research_only!==true||x.live_orders!==false||
             !Number.isSafeInteger(x.trigger_revision)||x.trigger_revision<1)
           throw Error('Invalid bounded public capture trigger');
          JS
      - name: Capture bounded real public Hyperliquid L2 after registered start
        env:
          MAHORAGA_FORWARD_OUT: /tmp/mahoraga-v108-capture
        run: node research/v10/forward/capture.cjs
      - name: Audit provenance, complete market gaps and no activation
        if: always()
        run: |
          node - <<'JS'
          const fs=require('node:fs'),F=require('./research/v10/forward/forward.cjs');
          const A=require('./research/v10/forward/audit.cjs');
          const dir='/tmp/mahoraga-v108-capture/';
          if(!fs.existsSync(dir+'capture-receipt.json'))process.exit(2);
          const raw=fs.readFileSync(dir+'capture-receipt.json','utf8');
          const [expected]=fs.readFileSync(dir+'capture-receipt.sha256','utf8').trim().split(/\s+/);
          if(F.hash(raw)!==expected)throw Error('Capture receipt hash failed');
          const audit=A.audit(JSON.parse(raw),JSON.parse(fs.readFileSync(dir+'selected-public-frames.json','utf8')));
          if(audit.approved_for_live||audit.training_eligible_samples)
            throw Error('Unexpected live/model promotion');
          console.log(JSON.stringify({source_run:audit.capture_run_id,observations:audit.observations,
            gaps:audit.source_gaps,live_orders:false,profitability_verified:false}));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mahoraga-v103-prospective-capture-receipt
          path: /tmp/mahoraga-v108-capture/
          retention-days: 30
