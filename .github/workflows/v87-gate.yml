name: INVO v8.7 Portfolio Crowding Audit
on:
  push:
    branches: [research/v8.2-v8.8-verified-gates]
    paths: ['research/v87/**','.github/workflows/v87-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/v87/portfolio.test.cjs
